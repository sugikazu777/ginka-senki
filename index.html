*{box-sizing:border-box}body{margin:0;background:#111f1c;color:#f2f3e8;font-family:system-ui,-apple-system,sans-serif}#app{margin:auto;max-width:520px;height:100dvh;background:linear-gradient(#30473a,#192d29);display:flex;flex-direction:column}.top{padding:10px 13px 7px;display:flex;justify-content:space-between;align-items:center;background:#182e2bdc}.logo{font-family:serif;font-size:23px;letter-spacing:.1em}.tag{font-size:10px;color:#b4d5ca}.round{background:#3c6570;padding:7px 10px;border-radius:8px;font-size:12px}#boardBox{position:relative;flex:1;min-height:390px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 40% 30%,#6d997c,#29483f 75%)}canvas{width:100%;height:100%;touch-action:none;display:block}#floating{position:absolute;top:8px;left:9px;right:9px;display:flex;justify-content:space-between;pointer-events:none;font-size:11px;text-shadow:0 1px 3px #142a22}.chip{background:#132821b8;padding:6px 9px;border-radius:7px}.hud{padding:10px;background:#192b2c;border-top:2px solid #698677}.stats{display:flex;align-items:center;gap:10px}.portrait{width:44px;height:44px;background:linear-gradient(135deg,#729dba,#4b6a93);display:grid;place-items:center;border:1px solid #c9e6e9;border-radius:10px;font-size:24px}.name{font-weight:700;font-size:14px}.minor{font-size:11px;color:#c5d8cf}.hp{height:6px;background:#425c51;border-radius:5px;margin-top:5px;overflow:hidden;width:135px}.hp>span{display:block;background:#71dbb9;height:100%}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}button{background:#375448;border:1px solid #688a7b;color:#fff;border-radius:10px;padding:11px 4px;font:600 12px system-ui}button:disabled{opacity:.35}button.sel{background:#447f92;border-color:#aae5f5}button.red{background:#8b5550}#message{font-size:12px;line-height:1.5;color:#e3eacb;min-height:36px;margin:9px 1px 0}.info{display:flex;justify-content:space-between;font-size:10px;color:#c8ded1;gap:4px}.info button{padding:5px 8px;font-size:10px}.foot{font-size:10px;color:#9fb9ad;text-align:center;padding:5px 10px}.key{color:#7ed8e5}.danger{color:#e9a399}#screen{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:#10241ddd}#screen>div{background:#234338;padding:24px;text-align:center;border:1px solid #b1c89c;border-radius:14px}#screen h2{margin:8px}#screen button{padding:12px 25px;margin-top:9px}
</style></head><body><main id="app"><header class="top"><div><div class="logo">銀花戦記</div><div class="tag">P02 ─ リリアのビジュアル試作</div></div><div class="round" id="phase">ROUND 1 · 味方</div></header><section id="boardBox"><canvas id="cv"></canvas><div id="floating"><div class="chip">高低差 0・1・2</div><div class="chip" id="mission">敵を全滅させよう</div></div><div id="screen"><div><h2 id="resultTitle"></h2><p id="resultText"></p><button onclick="reset()">もう一度プレイ</button></div></div></section><section class="hud"><div class="stats"><div class="portrait" id="portrait">⚔</div><div><div class="name" id="unitName">リリア</div><div class="minor" id="unitStats">HP 30/30　移動3　射程1</div><div class="hp"><span id="hpfill" style="width:100%"></span></div></div><div style="margin-left:auto;text-align:right"><div class="minor" id="heightText">高さ 0</div><div class="minor" id="turnText">味方フェイズ</div></div></div><div class="buttons"><button id="move" class="sel">移動</button><button id="attack">攻撃</button><button id="inspect">敵の範囲</button><button id="wait">待機 →</button></div><div id="message">緑色のマスをタップして移動先を選び、もう一度タップして確定します。</div><div class="info"><span><span class="key">■</span>移動可能 <span class="danger">■</span>敵の攻撃可能</span><span>固定カメラ · 9:16</span><button id="reset">最初から</button></div></section><div class="foot">前後左右へ移動・1段差まで移動可・地形戦闘補正なし</div></main><script>
window.addEventListener('error',function(e){var m=document.getElementById('message');if(m)m.textContent='描画エラー: '+(e.message||'unknown')});
(()=>{'use strict';const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W=8,H=10,tw=43,th=31,originX=0,originY=0,scale=1,viewZoom=1.38,panX=0,panY=0,liliaAnim=null,slashAnim=null,tiles=[],units=[],phase='ally',round=1,selected=0,inspectMode=false,pending=null,busy=false,over=false,msg='',particle=null;const $=x=>document.getElementById(x),dirs=[[1,0],[-1,0],[0,1],[0,-1]],dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y),key=(x,y)=>x+','+y;const V=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
function makeTiles(){tiles=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){let h=0,walk=true,type='grass';if(y<=2&&x>=2&&x<=6)h=1;if(y<=1&&x>=4&&x<=5)h=2;if(y>=7&&x<=2)h=1;if(y>=8&&x===0)h=2;if(y===4&&x!==3&&x!==4){walk=false;type='water'}if(y===4&&walk)type='bridge';if(x===7&&y===8||x===0&&y===1){walk=false;type='rock'}tiles.push({x,y,h,walk,type})}}
const t=(x,y)=>tiles[y*W+x],occ=(x,y)=>units.find(u=>u.hp>0&&u.x===x&&u.y===y),living=s=>units.filter(u=>u.hp>0&&u.side===s);function u(name,side,x,y,hp,atk,def,move,rmin,rmax,sym,speed){return{name,side,x,y,hp,max:hp,atk,def,move,rmin,rmax,sym,speed,done:false}};
function reset(){makeTiles();units=[u('リリア','ally',3,7,30,10,3,3,1,1,'⚔',12),u('セレス','ally',4,7,36,7,5,2,1,1,'♜',8),u('フィオナ','ally',2,8,22,8,2,3,2,3,'🏹',14),u('ミレイユ','ally',5,8,22,9,1,3,1,2,'✦',10),u('敵剣士','enemy',3,2,22,7,2,3,1,1,'♠',10),u('敵弓兵','enemy',5,2,17,6,1,2,2,3,'⌁',8),u('敵騎士','enemy',4,0,26,8,3,2,1,1,'♛',6)];phase='ally';round=1;selected=2;inspectMode=false;pending=null;busy=false;over=false;particle=null;$('screen').style.display='none';announce('移動先をタップすると経路を確認できます。もう一度タップすると移動します。');update()}
function moveRange(a){let q=[[a.x,a.y,0]],out=new Map([[key(a.x,a.y),0]]),paths=new Map();for(let i=0;i<q.length;i++){let[x,y,c]=q[i];for(let[dx,dy]of dirs){let nx=x+dx,ny=y+dy;if(!V(nx,ny)||!t(nx,ny).walk||occ(nx,ny)||Math.abs(t(nx,ny).h-t(x,y).h)>1||c+1>a.move)continue;let k=key(nx,ny);if((out.get(k)??99)<=c+1)continue;out.set(k,c+1);paths.set(k,key(x,y));q.push([nx,ny,c+1])}}return{out,paths}}
function targets(a,pos){let result=new Set();for(let y=0;y<H;y++)for(let x=0;x<W;x++){let d=dist(pos,{x,y});if(d>=a.rmin&&d<=a.rmax&&t(x,y).walk)result.add(key(x,y))}return result}
function threats(enemy){let set=new Set();for(let k of moveRange(enemy).out.keys()){let[x,y]=k.split(',').map(Number);for(let p of targets(enemy,{x,y}))set.add(p)}return set}
function project(x,y,h){return {x:originX+panX+(x-W/2)*tw+(y-H/2)*tw*.23,y:originY+panY+(y-H/2)*th+(x-W/2)*th*.10-h*11*scale}}
function dims(){const area=$('boardBox').getBoundingClientRect();let dpr=Math.min(devicePixelRatio||1,2),width=area.width,height=area.height;cv.width=Math.round(width*dpr);cv.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(width/390,height/500);tw=43*scale*viewZoom;th=43*scale*viewZoom;originX=width/2;originY=height/2+6*scale;draw()}
function polygon(points,fill,stroke='#47674e',sw=.8){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.stroke()}
function renderTile(tile,range,attack){const p=project(tile.x,tile.y,tile.h),hw=tw*.51,hh=th*.51,depth=7*scale+tile.h*9*scale;let fill=['#7faa79','#b3bd8b','#d1c396'][tile.h];if(tile.type==='water')fill='#568ca4';if(tile.type==='bridge')fill='#c5b292';if(tile.type==='rock')fill='#8a9686';if((tile.x+tile.y)%4===0&&tile.type==='grass')fill=['#8eb483','#c4c69a','#dbcb9b'][tile.h];const pts=[[p.x-hw,p.y-hh],[p.x+hw,p.y-hh],[p.x+hw,p.y+hh],[p.x-hw,p.y+hh]];polygon([[p.x-hw,p.y+hh],[p.x+hw,p.y+hh],[p.x+hw,p.y+hh+depth],[p.x-hw,p.y+hh+depth]],'#4a6652');polygon([[p.x+hw,p.y-hh],[p.x+hw,p.y+hh],[p.x+hw,p.y+hh+depth],[p.x+hw,p.y-hh+depth]],'#678567');polygon(pts,fill,'#b7c5a5',.8*scale);if(tile.type==='water'){ctx.strokeStyle='#a8d6df';ctx.beginPath();ctx.moveTo(p.x-9*scale,p.y);ctx.lineTo(p.x+6*scale,p.y-3*scale);ctx.stroke()}if(tile.type==='rock'){polygon([[p.x-9*scale,p.y+5*scale],[p.x-4*scale,p.y-12*scale],[p.x+6*scale,p.y-9*scale],[p.x+13*scale,p.y+7*scale]],'#75847e','#d1d6ba',1)}if(tile.type==='grass'&&(tile.x*7+tile.y*13)%9===0){ctx.fillStyle='#f7d4e2';ctx.beginPath();ctx.arc(p.x+9*scale,p.y+5*scale,2.3*scale,0,7);ctx.fill()}
const k=key(tile.x,tile.y);if(range.has(k)||attack.has(k)){polygon(pts,range.has(k)?'#57ccbb80':'#e26f6680',range.has(k)?'#a7fff4':'#ffd0b6',1.4*scale)}if(pending&&pending.x===tile.x&&pending.y===tile.y){polygon(pts,'#e1b8538c','#fff4b2',3*scale)}if(tile.walk){ctx.fillStyle='#243e31aa';ctx.fillRect(p.x+hw-14*scale,p.y-hh+2*scale,12*scale,11*scale);ctx.fillStyle='#fff';ctx.font=`${9*scale}px system-ui`;ctx.textAlign='center';ctx.fillText(tile.h,p.x+hw-8*scale,p.y-hh+11*scale)}return p}

function liliaSprite(a,p){
const S=Math.max(.65,scale*viewZoom),now=performance.now(),moving=liliaAnim&&now-liliaAnim.start<liliaAnim.duration;
const walk=moving?Math.sin((now-liliaAnim.start)/95):0,bob=moving?Math.abs(walk)*1.8:Math.sin(now/520)*.65;
const x=p.x,y=p.y-18*S-bob*S;
ctx.save();ctx.translate(x,y);ctx.scale(S,S);
const line=(pts,col,w)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();pts.forEach((v,i)=>i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1]));ctx.stroke()};
const shape=(pts,fill,stroke)=>{ctx.beginPath();pts.forEach((v,i)=>i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.8;ctx.stroke()}};
const hair=ctx.createLinearGradient(-13,-32,14,16);hair.addColorStop(0,'#fcffff');hair.addColorStop(.52,'#cdd9ee');hair.addColorStop(1,'#8897b7');
const silver=ctx.createLinearGradient(-12,-14,14,9);silver.addColorStop(0,'#f9ffff');silver.addColorStop(.35,'#b3c7df');silver.addColorStop(.65,'#fff');silver.addColorStop(1,'#7d91ad');
const cloth=ctx.createLinearGradient(-12,-2,12,19);cloth.addColorStop(0,'#d5eafc');cloth.addColorStop(.6,'#799fc9');cloth.addColorStop(1,'#3b608f');
const sway=Math.sin(now/490)*2.1;
ctx.fillStyle='#15292355';ctx.beginPath();ctx.ellipse(0,28,14,4,0,0,Math.PI*2);ctx.fill();
// long silver hair behind the figure
shape([[-9,-19],[-15,-7],[-17+sway,15],[-9+sway,21],[-3,8],[5,19],[13+sway,22],[16+sway,4],[9,-22]],hair,'#a9b8d0');
// short pale-blue cape
shape([[-9,-5],[-14+sway,13],[-6+sway,16],[0,6],[10+sway,18],[14+sway,7],[8,-6]],'#4c78ac','#c5dbf6');
// bare legs and two leather short boots (no stockings, no leg armor)
line([[-4,9],[-4+walk*2,24]],'#f2cbbd',4.7);line([[4,9],[4-walk*2,24]],'#f2cbbd',4.7);
shape([[-7+walk*2,21],[-2+walk*2,21],[-1+walk*2,29],[-8+walk*2,29]],'#493e43','#b79d8a');
shape([[2-walk*2,21],[7-walk*2,21],[9-walk*2,29],[1-walk*2,29]],'#493e43','#b79d8a');
// skirt with light-blue flare
shape([[-7,-2],[7,-2],[13+sway*.3,14],[6,16],[0,13],[-7,16],[-13+sway*.3,14]],cloth,'#e8eefa');
line([[-11,12],[-4,14],[0,12],[7,14],[11,12]],'#edf7ff',1);
// shoulder plates and breastplate
shape([[-9,-13],[9,-13],[8,0],[0,5],[-8,0]],silver,'#7890ba');
shape([[-14,-13],[-8,-17],[-4,-10],[-11,-5]],silver,'#e6f6ff');
shape([[14,-13],[8,-17],[4,-10],[11,-5]],silver,'#e6f6ff');
line([[-8,-7],[0,-4],[8,-7]],'#c8a66e',.85);
// arms, gloves, finely outlined sword
line([[-11,-6],[-12,5]],'#bdcee0',3.6);line([[11,-6],[11,6]],'#bdcee0',3.6);
shape([[9,3],[13,3],[13,8],[9,8]],'#677995','#e8e5d0');
line([[11,5],[22,-17]],'#f0fbff',2.1);line([[7,7],[15,3]],'#ad965b',2);
// head and pale face
ctx.fillStyle='#f8d9ce';ctx.beginPath();ctx.ellipse(0,-21,7.8,10,0,0,Math.PI*2);ctx.fill();
shape([[-9,-24],[-7,-34],[1,-38],[9,-31],[8,-24],[3,-30],[-2,-26],[-8,-23]],hair,'#e9f3ff');
line([[-4,-21],[-2,-21]],'#647d9b',1);line([[2,-21],[4,-21]],'#647d9b',1);
ctx.fillStyle='#7e9fd2';ctx.fillRect(7,-32,5,3);
ctx.strokeStyle='#c9dffc';ctx.lineWidth=.85;ctx.beginPath();ctx.arc(8,-32,2.6,0,Math.PI*2);ctx.stroke();
ctx.restore();
// always-visible HP bar, positioned in front of terrain
const top=y-44*S;ctx.fillStyle='#16302c';ctx.fillRect(x-18*S,top,36*S,5*S);
ctx.fillStyle='#7cdbb5';ctx.fillRect(x-17*S,top+1*S,34*S*a.hp/a.max,3*S);
if(selected===units.indexOf(a)){ctx.strokeStyle='#fff0ba';ctx.lineWidth=2*S;ctx.beginPath();ctx.ellipse(x,y+6*S,18*S,30*S,0,0,Math.PI*2);ctx.stroke()}
}

function drawUnit(a){if(a.hp<=0)return;let p=project(a.x,a.y,t(a.x,a.y).h);if(a.name==='リリア'){if(liliaAnim){const dt=(performance.now()-liliaAnim.start)/liliaAnim.duration;if(dt<1){const t=Math.max(0,Math.min(1,dt)),ease=t*t*(3-2*t);p={x:liliaAnim.from.x+(liliaAnim.to.x-liliaAnim.from.x)*ease,y:liliaAnim.from.y+(liliaAnim.to.y-liliaAnim.from.y)*ease}}else liliaAnim=null}liliaSprite(a,p);return}let c=a.side==='ally'?'#77b8d7':'#d87570',r=11*scale,cy=p.y-15*scale;ctx.fillStyle='#18332966';ctx.beginPath();ctx.ellipse(p.x,p.y+7*scale,14*scale,5*scale,0,0,7);ctx.fill();ctx.strokeStyle=selected===units.indexOf(a)?'#fcf0bd':'#d8e6dc';ctx.lineWidth=selected===units.indexOf(a)?3*scale:1.5*scale;if(selected===units.indexOf(a)){ctx.beginPath();ctx.ellipse(p.x,cy,18*scale,25*scale,0,0,7);ctx.stroke()}
// stylized low-poly 3D-inspired character: shadow, cape, tunic, head and simple weapon
polygon([[p.x-10*scale,cy+13*scale],[p.x,cy-8*scale],[p.x+10*scale,cy+13*scale]],a.side==='ally'?'#4c7791':'#984c4d','#edf4e8',1*scale);ctx.fillStyle=a.side==='ally'?'#9bc3e3':'#999da2';ctx.fillRect(p.x-5*scale,cy-3*scale,10*scale,16*scale);ctx.fillStyle='#f0d7bf';ctx.beginPath();ctx.arc(p.x,cy-11*scale,8*scale,0,Math.PI*2);ctx.fill();ctx.fillStyle=a.side==='ally'?'#d8d0c0':'#57545b';ctx.beginPath();ctx.arc(p.x,cy-15*scale,7*scale,Math.PI,Math.PI*2);ctx.fill();ctx.strokeStyle=a.side==='ally'?'#dae8fa':'#d1bcb0';ctx.lineWidth=2.4*scale;ctx.beginPath();ctx.moveTo(p.x+6*scale,cy+1*scale);ctx.lineTo(p.x+13*scale,cy-10*scale);ctx.stroke();ctx.fillStyle='#263c37';ctx.fillRect(p.x-16*scale,cy+17*scale,32*scale,6*scale);ctx.fillStyle=a.side==='ally'?'#82e2c3':'#ef8e89';ctx.fillRect(p.x-16*scale,cy+17*scale,32*scale*a.hp/a.max,6*scale);ctx.fillStyle='white';ctx.font=`${11*scale}px system-ui`;ctx.textAlign='center';ctx.fillText(a.hp+'/'+a.max,p.x,cy-25*scale)}
function draw(){let box=$('boardBox').getBoundingClientRect();if(!cv.width||!box.width)return;ctx.clearRect(0,0,box.width,box.height);let sky=ctx.createLinearGradient(0,0,0,box.height);sky.addColorStop(0,'#547e67');sky.addColorStop(1,'#24473a');ctx.fillStyle=sky;ctx.fillRect(0,0,box.width,box.height);let actor=units[selected],range=new Set(),attack=new Set();if(phase==='ally'&&actor&&!actor.done&&!inspectMode&&actor.side==='ally'){if(!actor.moved)range=new Set(moveRange(actor).out.keys());if(pending?.kind==='move')attack=targets(actor,pending);else if(actor.moved)attack=targets(actor,actor)}if(inspectMode){for(let e of living('enemy'))for(let k of threats(e))attack.add(k)}
for(let tile of tiles)renderTile(tile,range,attack);for(let a of units)drawUnit(a);if(particle&&performance.now()-particle.time<600){let t=(performance.now()-particle.time)/600;let p=project(particle.x,particle.y,0);ctx.fillStyle=`rgba(255,246,171,${1-t})`;ctx.font=`bold ${24*scale}px system-ui`;ctx.textAlign='center';ctx.fillText('-'+particle.amount,p.x,p.y-38*scale-t*25*scale);} }
function nearest(x,y){let best=null,score=9999;for(let tile of tiles){let p=project(tile.x,tile.y,tile.h),d=Math.hypot((x-p.x)/(tw*.55),(y-p.y)/(th*.55));if(d<score){score=d;best=tile}}return score<1.5?best:null}
function announce(s){msg=s;$('message').textContent=s}function update(){const a=units[selected];$('phase').textContent=`ROUND ${round} · ${phase==='ally'?'味方':'敵'}`;$('phase').style.background=phase==='ally'?'#3c6570':'#85554c';$('portrait').textContent=a.sym;$('unitName').textContent=a.name+(a.side==='enemy'?'（敵）':'');$('unitStats').textContent=`HP ${a.hp}/${a.max}　移動${a.move}　射程${a.rmin}–${a.rmax}`;$('hpfill').style.width=(a.hp/a.max*100)+'%';$('heightText').textContent='高さ '+t(a.x,a.y).h;$('turnText').textContent=phase==='ally'?'味方フェイズ':'敵フェイズ';$('move').disabled=phase!=='ally'||a.side!=='ally'||a.moved||a.done;$('attack').disabled=phase!=='ally'||a.side!=='ally'||a.done;$('wait').disabled=phase!=='ally'||a.side!=='ally'||a.done;$('inspect').classList.toggle('sel',inspectMode);draw()}
function fight(a,b){if(a.name==='リリア')slashAnim={start:performance.now(),x:a.x,y:a.y,tx:b.x,ty:b.y};let damage=Math.max(1,a.atk-b.def);b.hp=Math.max(0,b.hp-damage);particle={x:b.x,y:b.y,amount:damage,time:performance.now()};announce(a.name+'が'+b.name+'を攻撃！ '+damage+'ダメージ。');if(b.hp===0)announce(b.name+'を撃破しました！');if(living('enemy').length===0)end(true);else if(units[0].hp<=0)end(false)}function end(win){over=true;$('screen').style.display='flex';$('resultTitle').textContent=win?'🌸 勝利！':'⚔ 敗北';$('resultText').textContent=win?'敵部隊を退けました。':'騎士団長が倒れました。'}
function nextAlly(){let order=units.map((u,i)=>({u,i})).filter(o=>o.u.side==='ally'&&o.u.hp>0&&!o.u.done).sort((a,b)=>b.u.speed-a.u.speed);pending=null;if(order.length){selected=order[0].i;update();return}phase='enemy';selected=4;update();announce('敵フェイズ：敵部隊が行動します。');let stamp=++session;let enemies=units.map((u,i)=>({u,i})).filter(o=>o.u.side==='enemy'&&o.u.hp>0).sort((a,b)=>b.u.speed-a.u.speed);let i=0;function act(){if(stamp!==session||over)return;if(i>=enemies.length){round++;phase='ally';units.forEach(u=>{u.done=false;u.moved=false});nextAlly();return}let ob=enemies[i++];if(ob.u.hp>0){selected=ob.i;enemyAction(ob.u);update()}setTimeout(act,540)}setTimeout(act,400)}
let session=0;function enemyAction(e){let allies=living('ally');if(!allies.length)return;let closest=allies.slice().sort((a,b)=>dist(e,a)-dist(e,b))[0];if(dist(e,closest)>=e.rmin&&dist(e,closest)<=e.rmax){fight(e,closest);return}let opts=[...moveRange(e).out.keys()].map(k=>k.split(',').map(Number)).sort((a,b)=>dist({x:a[0],y:a[1]},closest)-dist({x:b[0],y:b[1]},closest));if(opts.length){let [x,y]=opts[0];e.x=x;e.y=y}let target=allies.find(a=>dist(e,a)>=e.rmin&&dist(e,a)<=e.rmax);if(target)fight(e,target)}
function tap(pos){if(over||phase!=='ally')return;const tile=nearest(pos.x,pos.y);if(!tile)return;let occupant=occ(tile.x,tile.y),current=units[selected];if(occupant?.side==='enemy'){if(inspectMode){selected=units.indexOf(occupant);announce(occupant.name+'：移動 '+occupant.move+'、射程 '+occupant.rmin+'〜'+occupant.rmax);update();return}if(current.side==='ally'&&!current.done&&dist(current,occupant)>=current.rmin&&dist(current,occupant)<=current.rmax){fight(current,occupant);current.done=true;nextAlly()}else{selected=units.indexOf(occupant);announce(occupant.name+'を選択しました。「敵の範囲」で危険マスを確認できます。');update()}return}if(occupant?.side==='ally'){selected=units.indexOf(occupant);pending=null;announce(occupant.name+'を選択しました。');update();return}if(current.side!=='ally'||current.done||inspectMode){announce('味方ユニットを選択してください。');return}if(current.moved){announce('移動は完了しています。攻撃か待機を選択してください。');return}const reachable=moveRange(current).out;if(!reachable.has(key(tile.x,tile.y))){announce('そこへは移動できません（2段差・障害物・移動力を確認）。');return}if(pending?.kind==='move'&&pending.x===tile.x&&pending.y===tile.y){if(current.name==='リリア'){liliaAnim={from:project(current.x,current.y,t(current.x,current.y).h),to:project(tile.x,tile.y,tile.x===undefined?0:t(tile.x,tile.y).h),start:performance.now(),duration:520}}current.x=tile.x;current.y=tile.y;current.moved=true;pending=null;announce(current.name+'が移動しました。敵をタップして攻撃、または待機してください。')}else{pending={kind:'move',x:tile.x,y:tile.y};announce('もう一度同じマスをタップすると移動します。')}update()}
function cursor(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}const pointers=new Map();let gesture=null,suppressTap=false;
function clampPan(){const w=cv.clientWidth,h=cv.clientHeight;panX=Math.max(-w*.8,Math.min(w*.8,panX));panY=Math.max(-h*.85,Math.min(h*.85,panY))}
function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function pinchDist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function startGesture(){const pts=[...pointers.values()];if(pts.length===2){const c=mid(pts[0],pts[1]);gesture={type:'pinch',startDistance:pinchDist(pts[0],pts[1]),zoom:viewZoom,panX,panY,center:c};suppressTap=true}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const p=cursor(e);pointers.set(e.pointerId,{...p,startX:p.x,startY:p.y});if(pointers.size===1){gesture={type:'tap',startX:p.x,startY:p.y,panX,panY};suppressTap=false}else startGesture()});
cv.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();const p=cursor(e),prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{...prev,x:p.x,y:p.y});
if(pointers.size>=2){if(!gesture||gesture.type!=='pinch')startGesture();const pts=[...pointers.values()],center=mid(pts[0],pts[1]);const oldZoom=viewZoom;viewZoom=Math.max(.85,Math.min(2.5,gesture.zoom*pinchDist(pts[0],pts[1])/Math.max(1,gesture.startDistance)));const ratio=viewZoom/oldZoom;tw=43*scale*viewZoom;th=43*scale*viewZoom;panX=(panX+originX-gesture.center.x)*ratio+center.x-originX;panY=(panY+originY-gesture.center.y)*ratio+center.y-originY;gesture.center=center;clampPan();draw();return}
if(gesture&&gesture.type!=='pinch'){const delta=Math.hypot(p.x-gesture.startX,p.y-gesture.startY);if(delta>9){gesture.type='drag';suppressTap=true}if(gesture.type==='drag'){panX=gesture.panX+p.x-gesture.startX;panY=gesture.panY+p.y-gesture.startY;clampPan();draw()}}
});
cv.addEventListener('pointerup',e=>{const p=cursor(e),wasPinch=gesture?.type==='pinch',wasDrag=gesture?.type==='drag';pointers.delete(e.pointerId);if(pointers.size===0){if(!suppressTap&&!wasPinch&&!wasDrag)tap(p);gesture=null;suppressTap=false}else if(wasPinch){gesture={type:'pinch'};suppressTap=true}});
cv.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);gesture=null;suppressTap=true});
$('move').onclick=()=>{inspectMode=false;pending=null;announce('移動可能な緑のマスを2回タップしてください。');update()};$('attack').onclick=()=>{inspectMode=false;pending=null;announce('射程内の敵をタップして攻撃します。');update()};$('inspect').onclick=()=>{inspectMode=!inspectMode;pending=null;announce(inspectMode?'赤色が敵全体の移動後攻撃可能範囲です。':'通常の移動操作へ戻りました。');update()};$('wait').onclick=()=>{if(phase!=='ally')return;units[selected].done=true;nextAlly()};$('reset').onclick=()=>{session++;reset()};window.reset=()=>{session++;reset()};window.addEventListener('resize',dims);if(typeof ResizeObserver!=='undefined'){new ResizeObserver(dims).observe($('boardBox'))}reset();requestAnimationFrame(dims);let lastFrame=0;function frame(ts){if(ts-lastFrame>32){draw();lastFrame=ts}requestAnimationFrame(frame)}requestAnimationFrame(frame);})();
