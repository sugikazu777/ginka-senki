</style></head><body><main id="app"><header class="top"><div><div class="logo">銀花戦記</div><div class="tag">P02.7 ─ 斜め見下ろし・段差強調</div></div><div class="round" id="phase">ROUND 1 · 味方</div></header><section id="boardBox"><canvas id="cv"></canvas><div id="floating"><div class="chip">高低差 0・1・2</div><div class="chip" id="mission">敵を全滅させよう</div></div><div id="screen"><div><h2 id="resultTitle"></h2><p id="resultText"></p><button onclick="reset()">もう一度プレイ</button></div></div></section><section class="hud"><div class="stats"><div class="portrait" id="portrait">⚔</div><div><div class="name" id="unitName">リリア</div><div class="minor" id="unitStats">HP 30/30　移動3　射程1</div><div class="hp"><span id="hpfill" style="width:100%"></span></div></div><div style="margin-left:auto;text-align:right"><div class="minor" id="heightText">高さ 0</div><div class="minor" id="turnText">味方フェイズ</div></div></div><div class="buttons"><button id="move" class="sel">移動</button><button id="attack">攻撃</button><button id="inspect">敵の範囲</button><button id="wait">待機 →</button></div><div id="message">緑色のマスをタップして移動先を選び、もう一度タップして確定します。</div><div class="info"><span><span class="key">■</span>移動可能 <span class="danger">■</span>敵の攻撃可能</span><span>固定カメラ · 9:16</span><button id="reset">最初から</button></div></section><div class="foot">前後左右へ移動・1段差まで移動可・地形戦闘補正なし</div></main><script>

(()=>{'use strict';const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W=8,H=10,tw=43,th=31,originX=0,originY=0,scale=1,viewZoom=1.66,panX=0,panY=0,liliaAnim=null,slashAnim=null,tiles=[],units=[],phase='ally',round=1,selected=0,inspectMode=false,pending=null,busy=false,over=false,msg='',particle=null;const $=x=>document.getElementById(x),dirs=[[1,0],[-1,0],[0,1],[0,-1]],dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y),key=(x,y)=>x+','+y;const V=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
function makeTiles(){tiles=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){let h=0,walk=true,type='grass';if(y<=2&&x>=2&&x<=6)h=1;if(y<=1&&x>=4&&x<=5)h=2;if(y>=7&&x<=2)h=1;if(y>=8&&x===0)h=2;if(y===4&&x!==3&&x!==4){walk=false;type='water'}if(y===4&&walk)type='bridge';if(x===7&&y===8||x===0&&y===1){walk=false;type='rock'}tiles.push({x,y,h,walk,type})}}
const t=(x,y)=>tiles[y*W+x],occ=(x,y)=>units.find(u=>u.hp>0&&u.x===x&&u.y===y),living=s=>units.filter(u=>u.hp>0&&u.side===s);function u(name,side,x,y,hp,atk,def,move,rmin,rmax,sym,speed){return{name,side,x,y,hp,max:hp,atk,def,move,rmin,rmax,sym,speed,done:false}};
function reset(){makeTiles();units=[u('リリア','ally',3,7,30,10,3,3,1,1,'⚔',12),u('セレス','ally',4,7,36,7,5,2,1,1,'♜',8),u('フィオナ','ally',2,8,22,8,2,3,2,3,'🏹',14),u('ミレイユ','ally',5,8,22,9,1,3,1,2,'✦',10),u('敵剣士','enemy',3,2,22,7,2,3,1,1,'♠',10),u('敵弓兵','enemy',5,2,17,6,1,2,2,3,'⌁',8),u('敵騎士','enemy',4,0,26,8,3,2,1,1,'♛',6)];phase='ally';round=1;selected=2;inspectMode=false;pending=null;busy=false;over=false;particle=null;$('screen').style.display='none';announce('移動先をタップすると経路を確認できます。もう一度タップすると移動します。');update()}
function moveRange(a){let q=[[a.x,a.y,0]],out=new Map([[key(a.x,a.y),0]]),paths=new Map();for(let i=0;i<q.length;i++){let[x,y,c]=q[i];for(let[dx,dy]of dirs){let nx=x+dx,ny=y+dy;if(!V(nx,ny)||!t(nx,ny).walk||occ(nx,ny)||Math.abs(t(nx,ny).h-t(x,y).h)>1||c+1>a.move)continue;let k=key(nx,ny);if((out.get(k)??99)<=c+1)continue;out.set(k,c+1);paths.set(k,key(x,y));q.push([nx,ny,c+1])}}return{out,paths}}
function targets(a,pos){let result=new Set();for(let y=0;y<H;y++)for(let x=0;x<W;x++){let d=dist(pos,{x,y});if(d>=a.rmin&&d<=a.rmax&&t(x,y).walk)result.add(key(x,y))}return result}
function threats(enemy){let set=new Set();for(let k of moveRange(enemy).out.keys()){let[x,y]=k.split(',').map(Number);for(let p of targets(enemy,{x,y}))set.add(p)}return set}
function project(x,y,h){return {x:originX+panX+((x-W/2)-(y-H/2))*tw*.56,y:originY+panY+((x-W/2)+(y-H/2))*th*.43-h*19*scale}}

function renderTile(tile,range,attack){const p=project(tile.x,tile.y,tile.h),hw=tw*.56,hh=th*.56,depth=12*scale+tile.h*15*scale;let fill=['#83a5a0','#b1beb2','#d1d1c6'][tile.h];if(tile.type==='water')fill='#507f99';if(tile.type==='bridge')fill='#c8cbd0';if(tile.type==='rock')fill='#8a9686';if((tile.x+tile.y)%4===0&&tile.type==='grass')fill=['#98b6b2','#c7cdc2','#e0ded0'][tile.h];const corners=[project(tile.x-.5,tile.y-.5,tile.h),project(tile.x+.5,tile.y-.5,tile.h),project(tile.x+.5,tile.y+.5,tile.h),project(tile.x-.5,tile.y+.5,tile.h)];const pts=corners.map(v=>[v.x,v.y]);const low=corners.map(v=>[v.x,v.y+depth]);polygon([pts[3],pts[2],low[2],low[3]],'#58787b');polygon([pts[0],pts[3],low[3],low[0]],'#405f67');polygon(pts,fill,'#d7e5d9',1.2*scale);if(tile.type==='water'){ctx.strokeStyle='#a8d6df';ctx.beginPath();ctx.moveTo(p.x-9*scale,p.y);ctx.lineTo(p.x+6*scale,p.y-3*scale);ctx.stroke()}if(tile.type==='rock'){polygon([[p.x-9*scale,p.y+5*scale],[p.x-4*scale,p.y-12*scale],[p.x+6*scale,p.y-9*scale],[p.x+13*scale,p.y+7*scale]],'#75847e','#d1d6ba',1)}if(tile.type==='grass'&&(tile.x*7+tile.y*13)%9===0){ctx.fillStyle='#f7d4e2';ctx.beginPath();ctx.arc(p.x+9*scale,p.y+5*scale,2.3*scale,0,7);ctx.fill()}
const k=key(tile.x,tile.y);if(range.has(k)||attack.has(k)){polygon(pts,range.has(k)?'#57ccbb80':'#e26f6680',range.has(k)?'#a7fff4':'#ffd0b6',1.4*scale)}if(pending&&pending.x===tile.x&&pending.y===tile.y){polygon(pts,'#e1b8538c','#fff4b2',3*scale)}if(tile.walk){ctx.fillStyle='#243e31aa';ctx.fillRect(p.x+hw-14*scale,p.y-hh+2*scale,12*scale,11*scale);ctx.fillStyle='#fff';ctx.font=`${9*scale}px system-ui`;ctx.textAlign='center';ctx.fillText(tile.h,p.x+hw-8*scale,p.y-hh+11*scale)}return p}
