const t=(x,y)=>tiles[y*W+x],occ=(x,y)=>units.find(u=>u.hp>0&&u.x===x&&u.y===y),living=s=>units.filter(u=>u.hp>0&&u.side===s);function u(name,side,x,y,hp,atk,def,move,rmin,rmax,sym,speed){return{name,side,x,y,hp,max:hp,atk,def,move,rmin,rmax,sym,speed,done:false}};

function moveRange(a){let q=[[a.x,a.y,0]],out=new Map([[key(a.x,a.y),0]]),paths=new Map();for(let i=0;i<q.length;i++){let[x,y,c]=q[i];for(let[dx,dy]of dirs){let nx=x+dx,ny=y+dy;if(!V(nx,ny)||!t(nx,ny).walk||occ(nx,ny)||Math.abs(t(nx,ny).h-t(x,y).h)>1||c+1>a.move)continue;let k=key(nx,ny);if((out.get(k)??99)<=c+1)continue;out.set(k,c+1);paths.set(k,key(x,y));q.push([nx,ny,c+1])}}return{out,paths}}

function threats(enemy){let set=new Set();for(let k of moveRange(enemy).out.keys()){let[x,y]=k.split(',').map(Number);for(let p of targets(enemy,{x,y}))set.add(p)}return set}

const textureImages={};
for(const [name,src] of Object.entries(textureSources)){const im=new Image();im.src=src;textureImages[name]=im;}
const terrainTextures={};
function paintTileImage(kind,corners){
 const im=textureImages[kind];if(!im||!im.complete||!im.naturalWidth)return;
 const a=corners[0],b=corners[1],d=corners[3];
 ctx.save();ctx.beginPath();ctx.moveTo(a[0],a[1]);for(let i=1;i<4;i++)ctx.lineTo(corners[i][0],corners[i][1]);ctx.closePath();ctx.clip();
 ctx.transform((b[0]-a[0])/im.width,(b[1]-a[1])/im.width,(d[0]-a[0])/im.height,(d[1]-a[1])/im.height,a[0],a[1]);ctx.drawImage(im,0,0);
 ctx.restore();
}
function renderTile(tile,range,attack){
const p=project(tile.x,tile.y,tile.h),depth=(tile.h+1)*46*scale;
const corners=[project(tile.x-.5,tile.y-.5,tile.h),project(tile.x+.5,tile.y-.5,tile.h),project(tile.x+.5,tile.y+.5,tile.h),project(tile.x-.5,tile.y+.5,tile.h)];
const pts=corners.map(v=>[v.x,v.y]),low=corners.map(v=>[v.x,v.y+depth]);
const seed=(tile.x*71+tile.y*137)%101;
let fill=['#83a7a0','#a7bdb5','#c6cfc7'][tile.h];
if(tile.type==='grass'&&seed%4===0)fill=['#92b4aa','#b8cbc0','#d4dcd0'][tile.h];
if(tile.type==='water')fill='#387d99';
if(tile.type==='bridge')fill='#ccd1d0';
if(tile.type==='rock')fill='#819497';
// sides as luminous silver limestone blocks. Surface shape and hit geometry unchanged.
polygon([pts[3],pts[2],low[2],low[3]],tile.type==='water'?'#315d73':'#839498','#d3dad4',.65*scale);
polygon([pts[0],pts[3],low[3],low[0]],tile.type==='water'?'#274f66':'#617a82','#afc3c4',.65*scale);
if(tile.type!=='water'){paintTileImage('wall',[pts[3],pts[2],low[2],low[3]]);paintTileImage('wall',[pts[0],pts[3],low[3],low[0]])}
if(tile.type!=='water'){
ctx.save();ctx.strokeStyle='#d0dad5aa';ctx.lineWidth=.75*scale;
for(let t=.26;t<.95;t+=.27){ctx.beginPath();ctx.moveTo(pts[3][0],pts[3][1]+depth*t);ctx.lineTo(pts[2][0],pts[2][1]+depth*t);ctx.stroke()}
ctx.strokeStyle='#526b7388';
for(let t=.33;t<.99;t+=.33){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]+depth*t);ctx.lineTo(pts[3][0],pts[3][1]+depth*t);ctx.stroke()}
ctx.restore();
}

polygon(pts,fill,'#d9e8df',1.15*scale);
// Cached bitmap textures are projected onto the diamond without changing its geometry.
paintTileImage(tile.type==='water'?'water':tile.type==='bridge'?'bridge':'grass',pts);
// Redraw clean edge on top of the detailed surface.
polygon(pts,'#00000000','#e0eee4',1.15*scale);
if(tile.type==='bridge'){
ctx.save();ctx.strokeStyle='#94a5a6';ctx.lineWidth=1.1*scale;
for(let t=.24;t<.85;t+=.25){const x=pts[0][0]*(1-t)+pts[1][0]*t,y=pts[0][1]*(1-t)+pts[1][1]*t;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(pts[3][0]-pts[0][0]),y+(pts[3][1]-pts[0][1]));ctx.stroke()}ctx.restore();
}
if(tile.type==='rock'){polygon([[p.x-9*scale,p.y+5*scale],[p.x-4*scale,p.y-12*scale],[p.x+6*scale,p.y-9*scale],[p.x+13*scale,p.y+7*scale]],'#a2aba9','#edf3eb',1)}
const k=key(tile.x,tile.y);
if(range.has(k)||attack.has(k))polygon(pts,range.has(k)?'#48d5c599':'#f06c718c',range.has(k)?'#bbfffa':'#ffd2bd',1.9*scale);
if(pending&&pending.x===tile.x&&pending.y===tile.y)polygon(pts,'#efc45b99','#fff1bb',3*scale);
if(tile.walk){
ctx.fillStyle='#243d45c9';ctx.fillRect(p.x+tw*.56-14*scale,p.y-th*.38+2*scale,12*scale,11*scale);
ctx.fillStyle='#fff';ctx.font=(9*scale)+'px system-ui';ctx.textAlign='center';ctx.fillText(tile.h,p.x+tw*.56-8*scale,p.y-th*.38+11*scale)
}
