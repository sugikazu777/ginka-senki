<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#152d3e">
<title>銀花戦記 — 街探索 E01 花祭りの午後</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#091c2c;color:#f8f5eb}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #ffde92;outline-offset:2px}
#game{position:relative;width:min(100vw,500px);height:100dvh;margin:auto;overflow:hidden;isolation:isolate;background:#203e4f;box-shadow:0 0 48px #0006}
#art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none;pointer-events:none;transition:opacity .16s}
#art-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(7,25,46,.13) 8%,transparent 27%,transparent 77%,rgba(6,20,35,.32) 93%);pointer-events:none}
#top{position:absolute;left:0;right:0;top:0;height:13.1%;min-height:110px;background:linear-gradient(to bottom,#102b43,#142f47 88%,#162e42 100%);z-index:3;padding:2.3% 3.5% 0}
.citybar{display:flex;align-items:center;justify-content:space-between;height:45%;gap:5px}
#city{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(20px,6vw,30px);line-height:1.2;letter-spacing:.02em;text-shadow:0 2px 8px #001c34}
#city:before{content:"✥";font-family:serif;color:#edd19b;font-size:22px;margin-right:7px}
#mapbtn{width:43px;height:43px;flex:0 0 43px;border:1px solid #dbba79;border-radius:50%;background:linear-gradient(130deg,#34586c,#0b283a);box-shadow:0 0 0 3px #122c3980;color:#f7e0b0;font-size:23px}
.nav{height:49%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid #f5dfae43;align-items:stretch;margin-top:1%}
.nav button{background:transparent;border:0;position:relative;padding:6px 0 4px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px}
.nav button+button:before{position:absolute;left:0;top:18%;height:63%;width:1px;background:#e0ca9866;content:""}
.nav .name{font-size:clamp(13px,4vw,19px);font-weight:650;text-shadow:0 1px 3px #162332}
.nav .desc{font-size:clamp(8px,2.6vw,12px);color:#d2d8d9;white-space:nowrap}
.nav button.active{color:#ffebae}
.nav button.active:after{content:"";position:absolute;bottom:1px;left:14%;right:14%;height:3px;border-radius:3px;background:#f8db83;box-shadow:0 0 10px #ffe49f,0 0 3px #fff}
#actions{position:absolute;inset:13% 0 8.7%;z-index:2;pointer-events:none}
.hotspot{position:absolute;pointer-events:auto;border:2px solid transparent;background:transparent;border-radius:20px;touch-action:manipulation}
.hotspot:focus-visible{background:#ffe3a428;outline:2px solid #f1dc9b;outline-offset:0}
.hotspot:active{background:#4bc7f922}
.hotspot.live{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;width:auto!important;height:auto!important;min-width:130px;max-width:55%;min-height:55px;background:linear-gradient(90deg,#092b48ed,#122e46d0);border:1px solid #d6c19a;box-shadow:0 2px 12px #031a3780;border-radius:8px;padding:7px 9px;text-align:left}
.hotspot .live-name{font-size:16px;font-weight:700}.hotspot .live-desc{font-size:10px;color:#d6e8e9;padding-top:3px}
#areaNotice{display:none;position:absolute;left:9%;right:9%;top:28%;padding:14px;background:#102f48e0;border:1px solid #ddc48c;border-radius:14px;text-align:center;z-index:2;pointer-events:none;line-height:1.6}
#areaNotice.show{display:block}
#bottom{position:absolute;bottom:0;left:0;right:0;height:8.7%;min-height:61px;background:linear-gradient(to bottom,#0b2132,#14283a);border-top:1px solid #ddc895;padding:3px 3px max(env(safe-area-inset-bottom),6px);display:grid;grid-template-columns:repeat(4,1fr);z-index:3;box-shadow:0 -4px 22px #03152690}
#bottom button{background:transparent;border:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;font-size:clamp(10px,3vw,14px);letter-spacing:.04em}
#bottom button+button{border-left:1px solid #a5bdd033}
#bottom .ico{font-size:clamp(20px,6vw,27px);line-height:1.1}
#overlay{position:absolute;inset:0;z-index:8;background:#031c30d6;display:none;flex-direction:column;justify-content:flex-end;align-items:center;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#overlay.open{display:flex}
#overlay.dialogue{background:linear-gradient(#031a33aa,#061a31e8)}
#close{position:absolute;right:13px;top:max(env(safe-area-inset-top),14px);height:42px;width:42px;border-radius:50%;background:#122d40e8;border:1px solid #e7d9bc;font-size:22px;z-index:10}
#portrait{object-fit:cover;object-position:top center;height:min(54dvh,480px);width:min(87%,430px);border-radius:22px 22px 0 0;mask-image:linear-gradient(to bottom,#000 80%,transparent);-webkit-mask-image:linear-gradient(to bottom,#000 80%,transparent);display:none}
#dialogueBox{background:linear-gradient(140deg,#f8f7f0fa,#dfeaf1f7);border:2px solid #bda67d;color:#213a4b;border-radius:10px;width:94%;min-height:170px;padding:15px;margin-bottom:7%;box-shadow:0 6px 28px #0008;display:none;flex-direction:column;gap:10px}
#speaker{align-self:flex-start;background:#254b63;color:#fff8e9;padding:5px 15px;border-radius:5px;font-size:14px}
#sentence{font-size:clamp(15px,4vw,19px);line-height:1.7;white-space:pre-wrap;min-height:70px}
#next{align-self:flex-end;background:#254b63;border:1px solid #bbab8b;border-radius:9px;padding:9px 20px;font-size:13px}
#panel{display:none;width:92%;max-height:76%;overflow:auto;background:#142e43f7;border:1px solid #d1b785;border-radius:13px;margin-bottom:12%;padding:20px;box-shadow:0 8px 36px #0008}
#panel h2{font-size:22px;margin:0 0 10px;font-family:serif}#panel p{font-size:13px;line-height:1.8;color:#d6e2e8}
#panel .entry{display:block;background:#25435b;border:1px solid #6d8192;width:100%;padding:14px;text-align:left;margin-top:9px;border-radius:10px;font-size:15px}
#panel .entry small{display:block;color:#bacdd3;margin-top:5px;font-size:12px}
#panel .entry[disabled]{opacity:.7}
#toast{position:absolute;bottom:10.5%;left:4%;right:4%;text-align:center;color:#f9eedb;background:#132e43da;padding:9px;border-radius:10px;font-size:12px;z-index:5;pointer-events:none;display:none}
#toast.show{display:block}
@media (min-width:520px){body{background:radial-gradient(ellipse,#213d50,#071728)}#game{border-left:1px solid #7188a0;border-right:1px solid #7188a0}}
@media (max-height:640px){#top{min-height:85px}#bottom{min-height:52px}.nav .name{font-size:13px}.nav .desc{font-size:8px}#portrait{height:38dvh}}
</style>
</head>

let area='market',currentTalk=null,lineNumber=0;
const overlay=$('#overlay'),portrait=$('#portrait'),panel=$('#panel'),dialogueBox=$('#dialogueBox');
const mapButton=$('#mapbtn');
function announce(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(announce.t);announce.t=setTimeout(()=>el.classList.remove('show'),2100)}
function loadArea(id){if(!content[id])return;area=id;const cfg=content[id];$('#art').src=IMG[id];$('#art').alt='王都アルシェリア・'+cfg.name+'の探索画面';$$('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.area===id);b.setAttribute('aria-current',b.dataset.area===id?'page':'false')});const actions=$('#actions');actions.innerHTML='';
 for(const a of cfg.actions){const btn=document.createElement('button');btn.className='hotspot'+(a.embedded?'':' live');btn.style.left=a.x+'%';btn.style.top=a.y+'%';btn.style.width=a.w+'%';btn.style.height=a.h+'%';btn.setAttribute('aria-label',a.name+'：'+a.desc+'。タップして調べる');btn.title=a.name+'：'+a.desc;
 if(!a.embedded){const n=document.createElement('span');n.className='live-name';n.textContent=(a.portrait?'◉ ':'⌕ ')+a.name;const d=document.createElement('span');d.className='live-desc';d.textContent=a.desc;btn.append(n,d)}
 btn.addEventListener('click',()=>openTalk(a));actions.append(btn)}
 const note=$('#areaNotice');note.textContent=cfg.draft?'「'+cfg.name+'」の背景は操作確認用の仮素材です。人物をタップすると会話します。':'';note.classList.toggle('show',cfg.draft);
}
function openDialog(){overlay.classList.add('open');overlay.setAttribute('aria-hidden','false')}
function closeDialog(){overlay.classList.remove('open','dialogue');overlay.setAttribute('aria-hidden','true');portrait.style.display='none';dialogueBox.style.display='none';panel.style.display='none';currentTalk=null}
function openTalk(action){currentTalk=action;lineNumber=0;portrait.src=IMG[action.portrait]||'';portrait.style.display=action.portrait?'block':'none';panel.style.display='none';dialogueBox.style.display='flex';overlay.classList.add('dialogue');openDialog();renderLine()}
function renderLine(){if(!currentTalk)return;const talk=currentTalk.lines[lineNumber];$('#speaker').textContent=talk[0];$('#sentence').textContent=talk[1];$('#next').textContent=lineNumber===currentTalk.lines.length-1?'探索へ戻る':'次へ ▾'}
function advanceLine(){if(!currentTalk)return;if(lineNumber>=currentTalk.lines.length-1){closeDialog();return}lineNumber++;renderLine()}
function showPanel(which){currentTalk=null;portrait.style.display='none';dialogueBox.style.display='none';panel.style.display='block';overlay.classList.remove('dialogue');openDialog();panel.replaceChildren();let head=document.createElement('h2'),desc=document.createElement('p');const titles={menu:'メニュー',party:'仲間',items:'所持品',quest:'クエスト',map:'王都アルシェリア・エリア案内'};head.textContent=titles[which]||'案内';panel.append(head);
 const messages={menu:'試作E01「花祭りの午後」。街のエリアと、人物との会話を体験できます。',party:'リリア、フィオナ、セレス、ミレイユ。大切な仲間たちとの日常を描いていきます。',items:'銀花のしおり ×1。アイテムの使用・管理は今後の試作で検討します。',quest:'現在の章：花祭りの午後。花市場でリリアやフィオナに話しかけてみましょう。',map:'行きたい場所を選択してください。'};desc.textContent=messages[which];panel.append(desc);
 if(which==='map'){for(const [id,cfg] of Object.entries(content)){const b=document.createElement('button');b.className='entry';b.innerHTML=cfg.name+(area===id?'　✓ 現在地':'')+'<small>'+cfg.subtitle+'</small>';b.addEventListener('click',()=>{closeDialog();loadArea(id)});panel.append(b)}}
 if(which==='menu'){const b=document.createElement('button');b.className='entry';b.textContent='戦闘版 P05.4を開く ↗';b.addEventListener('click',()=>window.open('../','_blank','noopener'));panel.append(b)}
}
$$('[data-area]').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.area!==area){loadArea(button.dataset.area)}else{announce('現在のエリアです：'+content[area].name)}}));
$$('[data-panel]').forEach(button=>button.addEventListener('click',()=>showPanel(button.dataset.panel)));
mapButton.addEventListener('click',()=>showPanel('map'));
$('#close').addEventListener('click',closeDialog);
$('#next').addEventListener('click',advanceLine);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeDialog()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();if(e.key==='Enter'&&currentTalk)advanceLine()});
loadArea('market');
</script>
